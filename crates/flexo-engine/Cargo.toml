[package]
name = "flexo-engine"
version = "0.2.0"
edition = "2021"

[features]
default = []
torrent = []

[dependencies]
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
futures = "0.3"
hex = "0.4"
if-addrs = "0.13"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
